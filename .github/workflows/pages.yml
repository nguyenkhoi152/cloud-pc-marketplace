name: Deploy design preview

# Chỉ đưa bản mẫu giao diện (design-preview/) lên GitHub Pages.
# Không đưa web/, archive-v1/, ảnh kiểm tra, tài liệu nội bộ hay bất kỳ file cấu hình nào.
on:
  push:
    branches: [main]
    paths:
      - "design-preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (allowlist only)
        run: |
          mkdir _site
          cp design-preview/index.html design-preview/machines.html design-preview/machine.html design-preview/session.html _site/
          cp design-preview/styles.css design-preview/app.js _site/
          cp -r design-preview/assets _site/assets
          touch _site/.nojekyll
          echo "Files to publish:"
          find _site -type f | sort

      - name: Guard against unintended files
        run: |
          if find _site -type f | grep -Ei '(archive|screenshots|\.md$|\.env|\.pem|\.key|node_modules|specs|docs)'; then
            echo "Unexpected file in published site" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
