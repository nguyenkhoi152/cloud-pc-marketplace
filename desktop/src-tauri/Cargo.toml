[package]
name = "cloud-pc-companion"
version = "0.1.0"
description = "Cloud PC Companion (vỏ native; UI ở ../src)"
edition = "2021"
rust-version = "1.90"

[lib]
name = "cloud_pc_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
